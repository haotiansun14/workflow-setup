name: Public browser print
on:
  push:
    branches: [public-source-capture-20261006]
    paths: ['.github/workflows/public-browser-print.yml']
permissions:
  contents: read
jobs:
  capture:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Install browser
        run: |
          python -m pip install playwright requests beautifulsoup4
          python -m playwright install --with-deps chromium
      - name: Print actual public source pages
        run: |
          mkdir -p out/captures
          cat >/tmp/browser.py <<'PY'
          from pathlib import Path
          import json,time,html
          from playwright.sync_api import sync_playwright
          root=Path('out/captures'); rec=[]
          targets={
            'D09_BBox_source_raw':'https://raw.githubusercontent.com/haotiansun14/BBox-Adapter/bea3065af2cc456ea079cb2cef7ad18859cf5667/algo/beam_search.py',
            'D10_PaperBench_rubric_raw':'https://raw.githubusercontent.com/openai/frontier-evals/f20fa7b2d5084557d6299ce5ea8458ce8fca95cb/project/paperbench/data/papers/bbox/rubric.json',
            'D11_PaperBench_blacklist_raw':'https://raw.githubusercontent.com/openai/frontier-evals/f20fa7b2d5084557d6299ce5ea8458ce8fca95cb/project/paperbench/data/papers/bbox/blacklist.txt'
          }
          with sync_playwright() as p:
            b=p.chromium.launch();c=b.new_context(viewport={'width':1200,'height':1000},device_scale_factor=2)
            for name,url in targets.items():
              pg=c.new_page()
              try:
                r=pg.goto(url,wait_until='domcontentloaded',timeout=25000)
                assert r.status==200,(url,r.status)
                text=pg.locator('body').inner_text();(root/(name+'.txt')).write_text(text)
                # Print-only layout: wrap original long lines; do not change source text.
                pg.add_style_tag(content='@media print { pre {white-space: pre-wrap !important; overflow-wrap: anywhere !important; font: 12px monospace !important; } }')
                header='<div style="font:8px sans-serif;width:94%;margin:0 3%;overflow-wrap:anywhere">'+html.escape(pg.url)+'</div>'
                pg.pdf(path=str(root/(name+'.pdf')),format='A4',print_background=True,display_header_footer=True,header_template=header,footer_template='<div style="font:8px sans-serif;width:94%;margin:0 3%"><span class="date"></span><span style="float:right" class="pageNumber"></span></div>',margin={'top':'0.65in','bottom':'0.4in','left':'0.35in','right':'0.35in'})
                rec.append(dict(name=name,url=pg.url,status=r.status,captured_utc=time.strftime('%Y-%m-%dT%H:%M:%SZ',time.gmtime()),print_layout='Browser print of actual raw source page; original content unchanged; long lines wrapped.'))
              except Exception as e:rec.append(dict(name=name,url=url,error=str(e)))
              pg.close()
            b.close()
          Path('out/manifest.json').write_text(json.dumps(rec,indent=2));print(json.dumps(rec,indent=2))
          PY
          python /tmp/browser.py
      - name: Save browser prints
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: public-browser-print
          path: out/
          retention-days: 7
          if-no-files-found: error
