name: Public software source captures
on:
  push:
    branches: [public-source-capture-20261006]
    paths: ['.github/workflows/public-software-evidence-20261007.yml']
permissions:
  contents: read
jobs:
  collect:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Install browser tools
        run: |
          pip install playwright
          python -m playwright install --with-deps chromium
      - name: Capture public sources
        run: |
          mkdir -p out
          cat > /tmp/capture.py <<'PY'
          import json,time,html
          from pathlib import Path
          from playwright.sync_api import sync_playwright
          root=Path('out'); log=[]
          targets=[
            ('onetwo','https://raw.githubusercontent.com/google-deepmind/onetwo/40d2484b2229e81fc889e9b1c802485d2f65e46d/onetwo/agents/python_planning.py','AdaPlanner','1-2'),
            ('toolevo_readme','https://raw.githubusercontent.com/Chen-GX/ToolEVO/b7eebb4830740571091025432c8f03f5e42b9c2f/README.md','ToolQA-D',''),
            ('toolevo_tools','https://raw.githubusercontent.com/Chen-GX/ToolEVO/b7eebb4830740571091025432c8f03f5e42b9c2f/MCTS/src/tool_online.py','scirex_create_chroma_db_local','1-2'),
            ('paperbench_task','https://raw.githubusercontent.com/openai/frontier-evals/f20fa7b2d5084557d6299ce5ea8458ce8fca95cb/project/paperbench/data/papers/bbox/rubric.json','BBOX-ADAPTER','1'),
            ('adaplanner_dbms','https://github.com/haotiansun14/AdaPlanner/issues/4','DBMS',''),
            ('icml_bbox','https://icml.cc/virtual/2024/poster/33293','Spotlight',''),
            ('paperbench_publisher','https://proceedings.mlr.press/v267/starace25a.html','PaperBench','')
          ]
          with sync_playwright() as p:
            browser=p.chromium.launch()
            ctx=browser.new_context(viewport={'width':1440,'height':1080},device_scale_factor=1)
            for name,url,needle,pages in targets:
              page=ctx.new_page();rec={'name':name,'requested_url':url,'retrieved_utc':time.strftime('%Y-%m-%dT%H:%M:%SZ',time.gmtime())}
              try:
                response=page.goto(url,wait_until='domcontentloaded',timeout=40000)
                page.wait_for_timeout(2200)
                text=page.locator('body').inner_text()
                rec.update(status=response.status if response else None,final_url=page.url,title=page.title(),required_text_present=needle in text)
                (root/f'{name}.txt').write_text(text)
                (root/f'{name}.html').write_text(page.content())
                blocked=(rec['status'] in [401,403,429]) or '/sorry/' in page.url or 'unusual traffic' in text.lower()
                if not blocked and rec['required_text_present']:
                  page.screenshot(path=str(root/f'{name}_viewport.png'))
                  if name=='adaplanner_dbms':
                    hit=page.get_by_text("I'm applying this code to query the DBMS.",exact=False)
                    if hit.count(): hit.first.scroll_into_view_if_needed();page.screenshot(path=str(root/f'{name}_detail.png'))
                  if 'raw.githubusercontent.com' in url:
                    page.add_style_tag(content='pre {white-space:pre-wrap!important;overflow-wrap:anywhere!important;font-size:10px!important;line-height:1.35!important}')
                  header='<div style="font:8px Arial;width:94%;margin:0 3%;overflow-wrap:anywhere">'+html.escape(page.url)+'</div>'
                  footer='<div style="font:8px Arial;width:94%;margin:0 3%">'+html.escape(rec['retrieved_utc'])+' | Browser print | <span class="pageNumber"></span> / <span class="totalPages"></span></div>'
                  kwargs=dict(path=str(root/f'{name}.pdf'),format='A4',print_background=True,display_header_footer=True,header_template=header,footer_template=footer,margin={'top':'0.7in','bottom':'0.5in','left':'0.35in','right':'0.35in'})
                  if pages:kwargs['page_ranges']=pages
                  page.pdf(**kwargs)
                  rec['pdf_saved']=True;rec['print_page_range']=pages or 'all'
                  rec['formatting_note']='Raw source lines wrapped for print without content edits' if 'raw.githubusercontent.com' in url else 'Original webpage printed'
                else:rec['pdf_saved']=False
              except Exception as e:rec['error']=str(e)
              finally:
                log.append(rec);(root/'capture_log.json').write_text(json.dumps(log,indent=2));page.close()
              time.sleep(2)
            browser.close()
          PY
          python /tmp/capture.py
      - name: Save public captures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: public-software-evidence-20261007
          path: out/
          retention-days: 7
          if-no-files-found: error
